# Arm D (W1.5.3): the default harness with the tool surface restricted to
# the four eval-baseline tools (bash/read_file/write_file/edit_file).
# Identical to default.harness.yaml except `tools: minimal` — the arm E
# comparison (default spec, full surface incl. bash_session/write_stdin)
# isolates the interactive-session tools' contribution on the interactive
# Task set is registered in suite.yaml.
context:
  - impl: pressure_compaction
  - impl: spill
retry:
  - impl: informed_backtrack
  - impl: simple
    params: {max_attempts: 3}
validator: "null"
tools: minimal
memory: stateless
orchestration: single
# Same loop section as default.harness.yaml — no round or tool-error cap.
# Harbor still passes --max-rounds 250 on the eval path.
loop:
  tool_dedup: false
