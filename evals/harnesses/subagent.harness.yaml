# Arm C (W1.4.2): the default harness plus subagent delegation.
# Identical to default.harness.yaml except `orchestration: subagent` —
# the factorial protocol (W1.4.3) requires arms differ in exactly one
# dimension so the attribution report can isolate orchestration's effect.
context:
  - impl: pressure_compaction
  - impl: spill
retry:
  - impl: informed_backtrack
  - impl: simple
    params:
      max_attempts: 3
      transport_max_attempts: 5
      transport_base_delay_ms: 1000
      transport_max_delay_ms: 8000
      transport_deadline_ms: 60000
validator: "null"
tools: full
memory: stateless
orchestration: subagent
# Same loop section as default.harness.yaml — arms must differ in exactly
# the orchestration dimension, not in an implicit fallback.
loop:
  tool_dedup: false
