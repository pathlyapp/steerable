[package]
name = "steerable-example-desktop"
version = "0.0.0"
description = "Minimal Steerable desktop host: neutral brand, one window"
authors = ["Steerable Framework"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "steerable_example_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "steerable-example-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
steerable-agent-shell-tauri = { path = "../../../packages/agent-shell/tauri" }
tauri = { version = "2.11.6", features = [] }
