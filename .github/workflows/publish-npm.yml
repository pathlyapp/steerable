name: Publish to npm

# Chained from release.yml after the lockstep gate passes. We walk the
# publishable `@steerable/*` TypeScript packages and publish whichever ones
# declare a version that isn't already on the registry. Idempotent by
# design — safe to re-dispatch after a partial failure; only missing
# versions get pushed.

on:
  # Canonical trigger: chained from release.yml's `validate` job after the
  # lockstep gate passes.
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        required: false
        default: false
  # Manual override for re-running after a transient publish failure
  # (e.g. npm registry 5xx). Re-running is safe because of the
  # registry-skip logic below.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip the actual `npm publish` step (still builds + diffs registry)."
        type: boolean
        default: false

# Allow only one publish run per ref at a time so two near-simultaneous merges
# can't race each other into a half-published state.
concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # `id-token: write` is required for `npm publish --provenance`, which signs
  # the published tarball with a sigstore attestation tied to this workflow
  # run. Consumers can verify the chain via `npm audit signatures`.
  id-token: write

jobs:
  publish:
    if: github.repository == 'pathlyapp/steerable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          # Setup the .npmrc to point at npmjs.org and read the auth token
          # from `NODE_AUTH_TOKEN` (set in the publish step's `env:` below).
          registry-url: "https://registry.npmjs.org"

      - name: Install + build workspace
        run: |
          pnpm install --frozen-lockfile
          pnpm gen
          pnpm build

      - name: Download runtime bundles
        # Each platform job builds one sidecar bundle; the package assembler
        # turns them into @steerable/runtime-<target>. A missing artifact is a
        # hard failure: publishing a CLI without its platform packages would
        # leave every install broken.
        uses: actions/download-artifact@v5
        with:
          pattern: steerable-sidecar-*
          path: artifacts

      - name: Download egress proxies and the Windows spawn helper
        # Both come from the private Rust release, verified against the
        # artifact lock. A target the release does not carry is a warning, not
        # a failure: the assembler records the gap and the CLI reports it at
        # run time. Since rust-v1.0.8 every target is present.
        run: |
          python scripts/fetch_verified_artifacts.py egress \
            --artifact-lock --target all --out artifacts || \
            echo "::warning::some egress proxy targets are unavailable; those runtime packages ship without the proxy"
          python scripts/fetch_verified_artifacts.py helper \
            --artifact-lock --out artifacts || \
            echo "::warning::the Windows spawn helper is unavailable; win32-x64 cannot start a sidecar"

      - name: Assemble platform runtime packages
        run: |
          python scripts/assemble_runtime_packages.py \
            --sidecar-root artifacts --egress-root artifacts --out dist/runtime

      - name: Verify platform package descriptors
        # Every published target must be present, carry its interpreter, and
        # declare the files the resolver hashes. A missing target here would
        # publish a CLI whose install cannot start on that platform.
        run: |
          python - <<'PY'
          import json, pathlib, sys

          TARGETS = ["darwin-arm64", "darwin-x64", "linux-x64", "linux-arm64", "win32-x64"]
          root = pathlib.Path("dist/runtime")
          present = {path.name.removeprefix("runtime-"): path for path in sorted(root.glob("runtime-*"))}
          missing_targets = [target for target in TARGETS if target not in present]
          problems = []
          for target, path in present.items():
              descriptor = json.loads((path / "runtime.json").read_text())
              if not (path / descriptor["sidecarPython"]).is_file():
                  problems.append(f"{target}: interpreter {descriptor['sidecarPython']} is not in the package")
              if not descriptor["files"]:
                  problems.append(f"{target}: runtime.json declares no files to verify")
              if descriptor["egressProxy"] is None:
                  print(f"::warning::{target} ships without the egress proxy; network rules there are port-only")
          for target in missing_targets:
              problems.append(f"{target}: no runtime package was assembled")
          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)
          print(f"::notice::all {len(TARGETS)} platform runtime packages verified")
          PY

      - name: Declare platform runtime dependencies
        # The repository cannot carry these entries: the packages do not exist
        # on the registry until this job publishes them. This runs before the
        # install check so the check sees the tarball a user would get.
        run: |
          version=$(node -p "require('./packages/agent-cli/ts/package.json').version")
          python scripts/set_runtime_optional_deps.py prepare --version "${version}"

      - name: Check the packed packages install and import
        # `tsc` resolves workspace packages to `src/`, so it cannot see that a
        # new export is missing from a sibling's published tarball. This packs
        # the batch, installs it into a clean project, and imports it. It runs
        # before publishing because a package that throws on import cannot be
        # unpublished.
        run: |
          python scripts/check_package_install.py \
            --package agent-protocol --package agent-harness \
            --package agent-runtime --package agent-client --package agent-cli

      - name: Publish each @steerable/* TS package whose version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not configured. See RELEASING.md → 'Configuring NPM_TOKEN'."
            exit 1
          fi

          published_any=0
          # pack-sdk 是 agent-shell 的纯类型依赖（workspace:* 会被 pnpm 重写为
          # 锁步版本号），必须先于 agent-shell 发布；agent-shell-web 是源码包，
          # 产品经 vite.base + @/ alias 消费其 src/，与 ts 同版本发布。
          # agent-runtime is consumed from source by no in-repo package and is
          # published for external TypeScript hosts; it must exist before the
          # CLI's optional platform dependencies resolve.
          # Workspace packages first, then the assembled runtime packages.
          # The runtime packages are generated into `dist/runtime/` and are not
          # workspace members, so `pnpm --filter` cannot see them; they are
          # published with `npm publish` from their own directory. They come
          # after `agent-cli`'s dependencies are on the registry, and before
          # `agent-cli` itself, which names them as optional dependencies.
          WORKSPACE_PACKAGES="packages/agent-protocol/ts packages/agent-harness/ts packages/agent-ui/ts packages/pack-sdk/ts packages/agent-runtime/ts packages/agent-shell/ts packages/agent-client/ts packages/agent-shell/web packages/agent-shell/tauri"
          RUNTIME_PACKAGES="dist/runtime/runtime-darwin-arm64 dist/runtime/runtime-darwin-x64 dist/runtime/runtime-linux-x64 dist/runtime/runtime-linux-arm64 dist/runtime/runtime-win32-x64"

          publish_workspace() {
            dir=$1
            name=$(node -p "require('./${dir}/package.json').name")
            local_version=$(node -p "require('./${dir}/package.json').version")
            if npm view "${name}@${local_version}" version >/dev/null 2>&1; then
              echo "::notice title=skip::${name}@${local_version} is already on the registry."
              return
            fi
            echo "::group::publish ${name}@${local_version}"
            if [ "${DRY_RUN}" = "true" ]; then
              echo "DRY_RUN=true; would run: pnpm --filter ${name} publish --no-git-checks --access public --provenance"
              ( cd "${dir}" && npm pack --dry-run )
            else
              # `pnpm publish` rewrites `workspace:*` ranges to the resolved
              # version, runs the package's `prepublishOnly` script, and
              # honours `publishConfig.access` + `publishConfig.provenance`.
              pnpm --filter "${name}" publish --no-git-checks
            fi
            echo "::endgroup::"
            published_any=1
          }

          publish_runtime() {
            dir=$1
            if [ ! -d "${dir}" ]; then
              echo "::error::${dir} is missing; scripts/assemble_runtime_packages.py did not produce it."
              exit 1
            fi
            name=$(node -p "require('./${dir}/package.json').name")
            local_version=$(node -p "require('./${dir}/package.json').version")
            if npm view "${name}@${local_version}" version >/dev/null 2>&1; then
              echo "::notice title=skip::${name}@${local_version} is already on the registry."
              return
            fi
            echo "::group::publish ${name}@${local_version}"
            if [ "${DRY_RUN}" = "true" ]; then
              echo "DRY_RUN=true; would run: (cd ${dir} && npm publish --access public --provenance)"
              ( cd "${dir}" && npm pack --dry-run )
            else
              # `npm publish` from the package directory: these packages have no
              # `workspace:` ranges, and they are not workspace members.
              ( cd "${dir}" && npm publish --access public --provenance )
            fi
            echo "::endgroup::"
            published_any=1
          }

          for dir in ${WORKSPACE_PACKAGES}; do publish_workspace "${dir}"; done
          for dir in ${RUNTIME_PACKAGES}; do publish_runtime "${dir}"; done
          # The CLI names every runtime package as an optional dependency, so it
          # goes last: `npm install -g` resolves them from the registry.
          publish_workspace packages/agent-cli/ts

          if [ "${published_any}" = "0" ]; then
            echo "::notice title=nothing to publish::All @steerable/* TS packages were already at the latest published version."
          fi
