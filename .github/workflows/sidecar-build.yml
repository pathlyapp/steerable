name: Sidecar build

# Produces one signed bundle per published target. Two callers:
#   * `release.yml`, which needs them before publishing the platform runtime
#     packages — a CLI without its runtime cannot start;
#   * a `sidecar-v*` tag, for rebuilding the bundles alone.
#
# Artifacts are workflow-scoped, so a caller has to run these jobs in its own
# run: `release.yml` calls this file rather than downloading from a separate
# run.
on:
  workflow_dispatch:
  workflow_call:
  push:
    tags: ["sidecar-v*"]

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # `macos-14` is not provisioned for this repository: the job is
          # cancelled in one second with "The configuration
          # 'macos-14-arm64-us-default' is not supported". `macos-latest` is the
          # arm64 image here and runs.
          - os: macos-latest
            target: darwin-arm64
            wheel_platform: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
            wheel_platform: darwin-x64
          - os: ubuntu-24.04
            target: linux-x64
            wheel_platform: manylinux-x64
          # arm64 Linux servers and containers. ubuntu-24.04-arm is a native
          # arm64 runner, so the bundled interpreter needs no cross-build.
          - os: ubuntu-24.04-arm
            target: linux-arm64
            wheel_platform: manylinux-arm64
          - os: windows-2022
            target: win32-x64
            wheel_platform: win32-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The build/report steps use bash line continuations and quoting;
        # on Windows the default pwsh parses `\`-continuations as errors.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Package pure-Python wheels and download the verified native wheel
        run: |
          uv build --all-packages --out-dir dist/py
          rm -f dist/py/steerable_example_*.whl dist/py/steerable_example_*.tar.gz
          python scripts/fetch_verified_artifacts.py wheel \
            --artifact-lock \
            --platform ${{ matrix.wheel_platform }} \
            --out dist/py
      - name: Confirm the runner architecture matches the target
        # Labels like `macos-latest` can change architecture over time; a bundle
        # built for the wrong arch installs and then fails at import. The
        # target name is the contract, so check it before spending the build.
        run: |
          arch=$(python -c "import platform; print(platform.machine().lower())")
          case "${{ matrix.target }}" in
            darwin-arm64|linux-arm64) want="arm64|aarch64" ;;
            darwin-x64|linux-x64|win32-x64) want="x86_64|amd64" ;;
            *) want="" ;;
          esac
          if [ -n "$want" ] && ! echo "$arch" | grep -Eq "^(${want})$"; then
            echo "::error::runner architecture '$arch' does not match target ${{ matrix.target }}"
            exit 1
          fi
          echo "::notice::runner architecture $arch matches ${{ matrix.target }}"

      - name: Build sidecar bundle
        # 320 MB per-target size budget. The build uses the
        # `install_only_stripped` python-build-standalone variant (~300 MB
        # unpacked on Linux x64 vs ~700 MB for `install_only`); strip +
        # aggressive then removes unused stdlib, __pycache__, dist-info
        # metadata, pip/setuptools, and third-party tests/examples/docs.
        run: |
          python packages/sidecar/build/build_sidecar.py \
            --from-wheels dist/py \
            --target ${{ matrix.target }} \
            --strip-stdlib \
            --aggressive \
            --budget-mb 320
      - name: Report bundle size
        run: |
          python -c "import json,pathlib; m=json.loads(pathlib.Path('packages/sidecar/dist/python-runtime/${{ matrix.target }}/manifest.json').read_text()); mb=m['totalBytes']/1024/1024; print(f'::notice title=Sidecar bundle size::${{ matrix.target }}: {mb:.1f} MB')"
      - uses: actions/upload-artifact@v5
        with:
          name: steerable-sidecar-${{ matrix.target }}
          path: packages/sidecar/dist/python-runtime/${{ matrix.target }}
          if-no-files-found: error
